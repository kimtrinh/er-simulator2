<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MediSim ER — Local Edition</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;600;700;900&display=swap');
  body { font-family:'Inter',sans-serif; background:#020617; color:#e2e8f0; }
  .mono { font-family:'JetBrains Mono',monospace; }
  ::-webkit-scrollbar{width:6px;height:6px}
  ::-webkit-scrollbar-thumb{background:#334155;border-radius:10px}
  ::-webkit-scrollbar-track{background:rgba(15,23,42,.5)}
  .fade{animation:fade .4s ease forwards}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .pulse-dot{animation:pd 1.5s infinite}
  @keyframes pd{0%,100%{opacity:1}50%{opacity:.3}}
  textarea{resize:none}
</style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

<!-- ======= HEADER ======= -->
<header class="px-4 md:px-6 py-3 border-b border-slate-900 flex justify-between items-center bg-slate-950/70 backdrop-blur shrink-0">
  <div class="flex items-center gap-3">
    <div class="w-9 h-9 bg-emerald-600 rounded-xl flex items-center justify-center shadow-[0_0_20px_rgba(16,185,129,.3)]">
      <svg class="w-5 h-5 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
    </div>
    <div>
      <h1 class="text-base font-black tracking-tight uppercase italic">MediSim <span class="text-emerald-500 not-italic">ER</span></h1>
      <div class="flex items-center gap-1.5">
        <span id="connDot" class="w-1.5 h-1.5 rounded-full bg-slate-600"></span>
        <span id="connText" class="text-[8px] font-black text-slate-500 uppercase tracking-[.2em]">Local Engine: offline</span>
      </div>
    </div>
  </div>
  <div class="flex items-center gap-2">
    <button id="ttsBtn" class="p-2.5 rounded-xl border bg-emerald-500/10 border-emerald-500/40 text-emerald-400 transition" title="Toggle voice narration">
      <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M19.07 4.93a10 10 0 010 14.14M15.54 8.46a5 5 0 010 7.07"/></svg>
    </button>
    <button id="resetBtn" class="p-2.5 rounded-xl border bg-slate-900 border-slate-800 text-slate-500 hover:text-red-400 hover:border-red-400/50 transition" title="New case">
      <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 109-9 9 9 0 00-9 9"/><path d="M3 3v6h6"/></svg>
    </button>
    <button id="settingsBtn" class="p-2.5 rounded-xl border bg-slate-900 border-slate-800 text-slate-400 hover:text-emerald-400 hover:border-emerald-500/50 transition" title="Settings">
      <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
    </button>
  </div>
</header>

<main id="main" class="flex-1 overflow-hidden flex flex-col"></main>

<!-- ======= SETTINGS MODAL ======= -->
<div id="settingsModal" class="fixed inset-0 z-50 hidden bg-slate-950/90 backdrop-blur-xl items-center justify-center p-4">
  <div class="bg-slate-900 border border-slate-800 rounded-3xl max-w-lg w-full p-7 space-y-5">
    <div class="flex justify-between items-center">
      <h2 class="text-xl font-black">Local Model Settings</h2>
      <button id="closeSettings" class="text-slate-500 hover:text-white text-2xl leading-none">&times;</button>
    </div>
    <div class="space-y-1">
      <label class="text-[10px] font-black uppercase tracking-widest text-slate-500">Server URL (LM Studio / Ollama)</label>
      <input id="baseURL" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-emerald-500/50" placeholder="http://localhost:1234/v1" />
    </div>
    <div class="space-y-1">
      <label class="text-[10px] font-black uppercase tracking-widest text-slate-500">Model name</label>
      <div class="flex gap-2">
        <input id="model" class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-emerald-500/50" placeholder="e.g. qwen2.5-32b-instruct" />
        <button id="detectBtn" class="px-4 rounded-xl bg-slate-800 border border-slate-700 text-xs font-black uppercase tracking-widest hover:bg-slate-700 transition">Detect</button>
      </div>
      <p id="detectMsg" class="text-[11px] text-slate-500"></p>
    </div>
    <div class="space-y-1">
      <label class="text-[10px] font-black uppercase tracking-widest text-slate-500">Creativity (temperature): <span id="tempVal">0.7</span></label>
      <input id="temp" type="range" min="0" max="1.2" step="0.1" value="0.7" class="w-full accent-emerald-500" />
    </div>
    <button id="testBtn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl transition">Test connection</button>
    <div class="text-[11px] text-slate-500 leading-relaxed bg-slate-950/60 border border-slate-800 rounded-xl p-3">
      <b class="text-slate-400">LM Studio setup:</b> Developer tab → <b>Start Server</b> (port 1234) → load your Qwen model → enable <b>CORS</b> in server settings (required so this page can reach it). Then click <b>Detect</b> above.
    </div>
  </div>
</div>

<script>
// ===================== STATE =====================
const DEFAULT_VITALS = { hr:80, bpSystolic:120, bpDiastolic:80, rr:16, o2:98, temp:37.0, rhythm:'Sinus Rhythm' };
const S = {
  stage:'setup',
  baseURL: localStorage.getItem('ms_baseURL') || 'http://localhost:1234/v1',
  model: localStorage.getItem('ms_model') || '',
  temperature: parseFloat(localStorage.getItem('ms_temp') || '0.7'),
  tts: localStorage.getItem('ms_tts') !== '0',
  vitals: {...DEFAULT_VITALS},
  shown: {...DEFAULT_VITALS},
  trend: 'stable',
  messages: [], context:'', diagnosis:'', learningPoints:[],
  labs:[], reports:[], exam:[],
  // Workspace: which panel is showing, the player's differential, and the
  // running order/meds log that fills the chart.
  view:'sim', dx:[], orderLog:[], criticalActions:[],
  level: localStorage.getItem('ms_level') || 'resident',
  showSuggested:true,
  basket:[], orderGroup:'critical', orderSearch:'', logFilter:'all',
  loading:false
};

const $ = id => document.getElementById(id);
const main = $('main');

// ===================== TRAINING LEVELS =====================
// Mirrors data/trainingLevels.ts: the same engine pitched at where the player is
// in training — how the case is written, how much the team gives away, and how
// the debrief is marked.
const TRAINING_LEVELS = [
  { id:'student', label:'Medical Student', blurb:'Classic presentations. The team coaches you and flags what you miss.',
    casePrompt:'Write a classic, textbook presentation of a common emergency diagnosis. The history, vitals, and examination should point coherently at one answer. No rare variants, no red herrings, no competing diagnoses.',
    enginePrompt:'The nurse is experienced and proactive: she volunteers relevant observations, flags abnormal findings the player has not asked about, and gently prompts when an obvious next step is being missed. Explain the underlying physiology plainly in "clinicalRationale". Never state the diagnosis, but do not let the player stall.',
    debriefPrompt:'Mark as a supportive clinical teacher. Score generously, credit sound reasoning even when execution was incomplete, and frame every error as a learning point.',
    suggestionsExpanded:true },
  { id:'resident', label:'Resident', blurb:'Comorbidity and distractors. The team follows orders but will not prompt.',
    casePrompt:'Write a typical but non-trivial presentation: relevant comorbidity, an incomplete or unreliable history, or one distracting finding that has to be reasoned past. The diagnosis should be reachable but not obvious from the door chart.',
    enginePrompt:'The team answers what it is asked and carries out orders competently, but volunteers nothing and never hints. Include real-world friction: results take time, the scanner is busy, the patient is a poor historian.',
    debriefPrompt:'Mark to the standard expected of a senior resident running the resuscitation: timeliness of the critical actions, breadth and ranking of the differential, appropriate escalation.',
    suggestionsExpanded:true },
  { id:'attending', label:'Attending', blurb:'Undifferentiated and ambiguous. You run the room; consultants push back.',
    casePrompt:'Write an atypical, undifferentiated, or diagnostically ambiguous presentation — a blunted response in an elderly or immunosuppressed patient, two problems at once, or a common diagnosis wearing an unfamiliar face. Data should be incomplete and some findings genuinely misleading.',
    enginePrompt:'The team looks to the player to run the room and does nothing unprompted. Consultants may disagree, push back, or be slow to arrive. Introduce competing demands and resource constraints where they fit. Never hint, and never rescue a bad plan.',
    debriefPrompt:'Mark as a peer reviewing a colleague: diagnostic accuracy under uncertainty, resuscitation timing, resource stewardship, disposition, and communication. Name anchoring and premature closure explicitly where they occurred.',
    suggestionsExpanded:false }
];
const getLevel = id => TRAINING_LEVELS.find(l=>l.id===id) || TRAINING_LEVELS[1];

// ===================== ORDER CATALOGUE =====================

// clickable order, and the `critical` ones are the time-critical resuscitative
// interventions kept one click away.
const ORDER_GROUPS = [

  ]},
  { id:'resus', title:'Airway, Breathing & Access', blurb:'Oxygenation, ventilation, monitoring, and vascular access.', items:[
    {label:'ABCs / Primary Survey', detail:'Perform the primary survey: airway, breathing, circulation, disability, exposure.', category:'exam', keywords:'primary survey ATLS abcde trauma'},
    {label:'Airway Positioning', detail:'Open the airway with a jaw thrust, suction secretions, and place an oral airway.', category:'procedure', keywords:'jaw thrust suction OPA NPA airway'},
    {label:'High-Flow Oxygen', detail:'Place the patient on 15 L/min oxygen via non-rebreather mask.', category:'procedure', keywords:'oxygen NRB non rebreather hypoxia'},
    {label:'BVM Ventilation', detail:'Begin bag-valve-mask ventilation with a two-person technique and a PEEP valve.', category:'procedure', keywords:'bag mask ventilate apnea BVM'},
    {label:'BiPAP / NIV', detail:'Start BiPAP at 12/5 cm H2O and titrate to work of breathing and oxygenation.', category:'procedure', keywords:'noninvasive ventilation CPAP BiPAP CHF COPD'},
    {label:'High-Flow Nasal Cannula', detail:'Start high-flow nasal cannula at 40 L/min, FiO2 titrated to a target saturation.', category:'procedure', keywords:'HFNC optiflow oxygen'},

    {label:'Intraosseous Access', detail:'Place an intraosseous line in the proximal tibia for immediate access.', category:'procedure', keywords:'IO tibia humeral access difficult IV'},

  { id:'labs', title:'Laboratory', blurb:'Bedside and send-out studies.', items:[

const CRITICAL_ACTIONS = ALL_ORDERS.filter(o=>o.critical);
const CATEGORY_LABELS = { critical:'Critical Action', medication:'Medication', lab:'Laboratory', imaging:'Imaging', procedure:'Procedure', exam:'Examination', history:'History', consult:'Consult', disposition:'Disposition', other:'Order' };
const CATEGORY_HINTS = [
  ['critical', ['tourniquet','pelvic binder','thoracotomy','cricothyro','reboa','massive transfusion','defibrill','needle decompress','cpr','code blue']],
  ['medication', ['give ','administer','mg','mcg','grams',' iv push','bolus','infusion','drip','start a','antibiotic','epinephrine','ketamine','fentanyl','insulin','naloxone']],
  ['lab', ['cbc','chem','panel','troponin','lactate','blood gas','culture','urinalysis','d-dimer','inr','crossmatch','level','lab']],
  ['imaging', ['x-ray','xray','ct ','ekg','ecg','ultrasound','echo','fast','mri','imaging','radiograph']],
  ['procedure', ['intubat','chest tube','central line','lumbar puncture','catheter','splint','suture','reduce','sedation','place ','insert']],
  ['exam', ['exam','auscultat','palpat','inspect','listen','look at','vitals']],
  ['history', ['ask','history','tell me','what happened','collateral','allerg']],
  ['consult', ['consult','call ','page ','activate']],
  ['disposition', ['admit','discharge','transfer','operating room','disposition','icu']]
];

const normOrder = s => (s||'').toLowerCase().replace(/\(.*?\)/g,' ').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();

/** Find the catalogue order a piece of free text is naming, if any. */
function matchOrder(text){
  const raw=(text||'').trim(); if(!raw) return undefined;
  const byDetail = ALL_ORDERS.find(o=>o.detail===raw); if(byDetail) return byDetail;
  const t = normOrder(raw);
  const exact = ALL_ORDERS.find(o=>normOrder(o.label)===t); if(exact) return exact;
  return ALL_ORDERS.find(o=>{ const l=normOrder(o.label); return l.length>=6 && t.length>=6 && (t.includes(l)||l.includes(t)); });
}
/** Map free text (usually a critical action named by the model) onto a catalogue order. */
function resolveOrderText(text){
  return matchOrder(text) || { label:text, detail:text, category:'critical', critical:true };
}
function classifyOrder(text){
  const known=matchOrder(text); if(known) return known.category;
  const t=(text||'').toLowerCase();
  for(const [cat,terms] of CATEGORY_HINTS){ if(terms.some(x=>t.includes(x))) return cat; }
  return 'other';
}
function labelForOrder(text){
  const known=matchOrder(text); if(known) return known.label;
  const clean=(text||'').trim().replace(/\s+/g,' ');
  return clean.length>60 ? clean.slice(0,57)+'…' : clean;
}
function logOrders(action, entries){
  const time=new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
  const list = (entries && entries.length) ? entries
    : [{ label: labelForOrder(action), category: classifyOrder(action) }];
  S.orderLog = list.map(e=>({ label:e.label, category:e.category||'other', critical:!!e.critical, time })).concat(S.orderLog);
}

async function callModel(messages){
  const url = S.baseURL.replace(/\/+$/,'') + '/chat/completions';
  const res = await fetch(url, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      model: S.model || 'local-model',
      messages,
      temperature: S.temperature,
      max_tokens: 1600
      // Note: no response_format — we ask for JSON in the prompt and extract it
      // ourselves, which is compatible with every local server (LM Studio,
      // Ollama, llama.cpp) regardless of which response_format types it supports.
    })
  });
  if(!res.ok){
    const t = await res.text().catch(()=> '');
    throw new Error('Model server returned '+res.status+'. '+t.slice(0,160));
  }
  const data = await res.json();
  return data.choices?.[0]?.message?.content || '';
}

function extractJSON(text){
  if(!text || !text.trim()) throw new Error('The model returned an empty response.');
  let t = text.trim().replace(/^```(?:json)?/i,'').replace(/```$/,'').trim();
  const a = t.indexOf('{'), b = t.lastIndexOf('}');
  if(a===-1||b===-1) throw new Error('Could not find JSON in the model output. Try lowering temperature.');
  return JSON.parse(t.slice(a,b+1));
}

function normVitals(v){
  v = v || {};
  const n = (x,d)=>{ const f=parseFloat(x); return isFinite(f)?f:d; };
  return {
    hr:n(v.hr,DEFAULT_VITALS.hr), bpSystolic:n(v.bpSystolic,DEFAULT_VITALS.bpSystolic),
    bpDiastolic:n(v.bpDiastolic,DEFAULT_VITALS.bpDiastolic), rr:n(v.rr,DEFAULT_VITALS.rr),
    o2:n(v.o2,DEFAULT_VITALS.o2), temp:n(v.temp,DEFAULT_VITALS.temp),
    rhythm: v.rhythm || DEFAULT_VITALS.rhythm
  };
}

// ===================== ECG WAVEFORM =====================
let ecgRAF=null, ecgX=0, ecgBuf=[];
function startECG(canvas){
  cancelAnimationFrame(ecgRAF);
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio||1;
  function resize(){ canvas.width=canvas.clientWidth*dpr; canvas.height=canvas.clientHeight*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); }
  resize(); window.addEventListener('resize',resize);
  const W=()=>canvas.clientWidth, H=()=>canvas.clientHeight;
  ecgBuf = new Array(Math.ceil(canvas.clientWidth)).fill(0);
  let t=0;
  function beat(phase){ // phase 0..1 of one cardiac cycle -> mV-ish
    const p=phase;
    if(p<0.10) return 0.08*Math.sin(p/0.10*Math.PI);          // P
    if(p<0.16) return 0;                                       // PR
    if(p<0.18) return -0.12;                                   // Q
    if(p<0.21) return 1.0;                                     // R
    if(p<0.24) return -0.28;                                   // S
    if(p<0.42) return 0;                                       // ST
    if(p<0.58) return 0.20*Math.sin((p-0.42)/0.16*Math.PI);    // T
    return 0;
  }
  function frame(){
    const hr = Math.max(20, S.shown.hr||60);
    const cycle = 60/hr;          // seconds per beat
    const speed = 0.016;          // seconds advanced per frame (~60fps)
    t += speed;
    const phase = (t % cycle)/cycle;
    const crit = hr>120||hr<50;
    const y = beat(phase);
    ecgBuf.push(y); if(ecgBuf.length>W()) ecgBuf.shift();
    ctx.clearRect(0,0,W(),H());
    // grid
    ctx.strokeStyle='rgba(226,232,240,.05)'; ctx.lineWidth=1;
    for(let x=0;x<W();x+=20){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H());ctx.stroke();}
    for(let yy=0;yy<H();yy+=20){ctx.beginPath();ctx.moveTo(0,yy);ctx.lineTo(W(),yy);ctx.stroke();}
    // trace
    ctx.strokeStyle = crit ? '#ef4444' : '#10b981';
    ctx.lineWidth=2; ctx.shadowBlur=8; ctx.shadowColor=ctx.strokeStyle;
    ctx.beginPath();
    const mid=H()*0.6, amp=H()*0.42;
    for(let i=0;i<ecgBuf.length;i++){
      const px=i, py=mid-ecgBuf[i]*amp;
      i===0?ctx.moveTo(px,py):ctx.lineTo(px,py);
    }
    ctx.stroke(); ctx.shadowBlur=0;
    ecgRAF=requestAnimationFrame(frame);
  }
  frame();
}

let driftTimer=null;
function startDrift(){
  clearInterval(driftTimer);
  driftTimer=setInterval(()=>{
    const j=(v,f)=>v+(Math.random()-0.5)*f;
    let {hr,bpSystolic:s,bpDiastolic:d,o2,rr,temp}=S.shown;
    const tgt=S.vitals;
    const ease=(c,t,step)=>Math.abs(c-t)<step?t:c+(c<t?step:-step);
    hr=ease(hr,tgt.hr,1); s=ease(s,tgt.bpSystolic,1); d=ease(d,tgt.bpDiastolic,1);
    o2=ease(o2,tgt.o2,0.5); rr=ease(rr,tgt.rr,0.5); temp=ease(temp,tgt.temp,0.1);
    if(S.trend==='worsening'){ hr=Math.min(160,hr+0.3); s=Math.max(60,s-0.2); o2=Math.max(80,o2-0.1); }
    if(S.trend==='critical'){ hr=Math.min(180,hr+0.8); s=Math.max(45,s-0.8); o2=Math.max(60,o2-0.3); }
    S.shown={
      hr:Math.round(j(hr,.6)), bpSystolic:Math.round(j(s,.6)), bpDiastolic:Math.round(j(d,.5)),
      o2:Math.min(100,Math.round(j(o2,.2))), rr:Math.round(j(rr,.3)),
      temp:parseFloat(j(temp,.02).toFixed(1)), rhythm:S.vitals.rhythm
    };
    paintVitals();
  },1000);
}
function paintVitals(){
  const v=S.shown; if(!$('v_hr')) return;
  const hrCrit=v.hr>120||v.hr<50, o2Crit=v.o2<92, bpCrit=v.bpSystolic<90||v.bpSystolic>180;
  $('v_hr').textContent=v.hr; $('v_hr').className='text-3xl font-black mono '+(hrCrit?'text-red-500':'text-emerald-500');
  $('v_bp').textContent=v.bpSystolic+'/'+v.bpDiastolic; $('v_bp').className='text-3xl font-black mono '+(bpCrit?'text-red-500':'text-yellow-400');
  $('v_o2').textContent=v.o2; $('v_o2').className='text-3xl font-black mono '+(o2Crit?'text-red-500':'text-blue-400');
  $('v_rr').textContent=v.rr;
  $('v_temp').textContent=v.temp+'°C';
  $('v_rhythm').textContent=v.rhythm;
  $('v_rhythm').className='text-[10px] font-black uppercase tracking-widest mono '+(hrCrit?'text-red-500':'text-emerald-500');
  const trendEl=$('v_trend');
  if(trendEl){
    const bad=S.trend==='worsening'||S.trend==='critical';
    trendEl.textContent=S.trend.toUpperCase();
    trendEl.className='text-[9px] font-black uppercase tracking-widest px-2 py-1 rounded-md '+(bad?'bg-red-500/10 text-red-500 border border-red-500/20':'bg-emerald-500/10 text-emerald-500 border border-emerald-500/20');
  }
}

// ---------- ORDERS ----------
function suggestedOrders(){
  const seen=new Set();
  return (S.criticalActions||[]).map(resolveOrderText).filter(o=>{
    const k=o.label.toLowerCase(); if(seen.has(k)) return false; seen.add(k); return true;
  });
}
function criticalRow(){
  const sug=suggestedOrders(), seen=new Set(sug.map(o=>o.label.toLowerCase()));
  return sug.concat(CRITICAL_ACTIONS.filter(o=>!seen.has(o.label.toLowerCase())));
}

function orderCard(o, idx){
  const sel = S.basket.some(b=>b.label===o.label);
  const base = o.critical
    ? 'bg-red-500/[.04] border-red-500/25 hover:border-red-500/60'
    : 'bg-slate-900/50 border-slate-800 hover:border-emerald-500/40';
  const selCls = sel ? (o.critical?'!border-red-500 bg-red-500/10':'!border-emerald-500 bg-emerald-500/10') : '';
  return `<div class="relative rounded-2xl border ${base} ${selCls} overflow-hidden">
    <button data-ord="${idx}" class="ordBtn w-full text-left p-3 pr-11">
      <div class="flex items-center gap-2">${o.critical?'<span class="text-red-500 text-[10px]">⚠</span>':''}
        <span class="text-xs font-bold leading-tight ${o.critical?'text-red-200':'text-slate-200'}">${esc(o.label)}</span></div>
      <p class="text-[10px] text-slate-500 mt-1 leading-snug line-clamp-2">${esc(o.detail)}</p>
    </button>
    <span class="absolute top-2 right-2 w-6 h-6 rounded-lg border flex items-center justify-center text-xs ${sel?(o.critical?'bg-red-500 border-red-500 text-white':'bg-emerald-500 border-emerald-500 text-white'):'border-slate-700 text-slate-700'}">${sel?'✓':'+'}</span>
    <button data-stat="${idx}" class="statBtn absolute bottom-2 right-2 px-2 py-1 rounded-lg border border-slate-800 bg-slate-950 text-[9px] font-black uppercase tracking-widest text-slate-600 hover:text-yellow-400 hover:border-yellow-500/50 transition" title="Send this one immediately">Stat</button>
  </div>`;
}

/** Search results, or the active group — split into the case-specific suggestions and the rest. */
function visibleOrders(){
  const q=(S.orderSearch||'').trim().toLowerCase();
  if(q){
    const seen=new Set();
    const hits = suggestedOrders().concat(ALL_ORDERS).filter(o=>{
      const k=o.label.toLowerCase(); if(seen.has(k)) return false; seen.add(k);
      return o.label.toLowerCase().includes(q) || o.detail.toLowerCase().includes(q) || (o.keywords||'').toLowerCase().includes(q);
    });
    return { suggested:[], rest:hits, blurb:`${hits.length} matching order${hits.length===1?'':'s'}` };
  }
  const sug=suggestedOrders(), shown=new Set(sug.map(o=>o.label.toLowerCase()));
  const g=ORDER_GROUPS.find(g=>g.id===S.orderGroup) || ORDER_GROUPS[0];
  // Only drop the suggestions from the critical list while the strip is showing
  // them; collapsed, they must stay reachable in the catalogue.
  const rest = g.id==='critical'
    ? (S.showSuggested ? CRITICAL_ACTIONS.filter(o=>!shown.has(o.label.toLowerCase())) : CRITICAL_ACTIONS)
    : g.items;
  return { suggested:sug, rest, blurb:g.blurb };
}

function renderOrders(){

function paintOrders(){
  const { suggested, rest, blurb } = visibleOrders();
  const list = suggested.concat(rest);   // one index space across both grids
  $('sugWrap').innerHTML = suggested.length
    ? `<button id="sugToggle" class="flex items-center gap-2 text-[10px] font-black uppercase tracking-widest text-red-400 hover:text-red-300 transition">⚡ Suggested for this patient <span class="text-slate-600">${S.showSuggested?'▾':`▸ ${suggested.length} hidden`}</span></button>
       <div class="grid gap-2 sm:grid-cols-2 2xl:grid-cols-3 ${S.showSuggested?'':'hidden'}">${suggested.map((o,i)=>orderCard(o,i)).join('')}</div>` : '';
  const sugToggle=$('sugToggle');
  if(sugToggle) sugToggle.onclick=()=>{ S.showSuggested=!S.showSuggested; paintOrders(); };
  $('listBlurb').textContent = blurb || '';
  $('ordList').innerHTML = rest.length
    ? rest.map((o,i)=>orderCard(o,i+suggested.length)).join('')
    : `<p class="text-xs text-slate-600 col-span-full">Nothing matched. Anything not in the catalogue can still be typed as a free-text order in the sim room.</p>`;
  document.querySelectorAll('.ordBtn').forEach(b=>b.onclick=()=>toggleBasket(list[+b.dataset.ord]));
  document.querySelectorAll('.statBtn').forEach(b=>b.onclick=()=>{ const o=list[+b.dataset.stat]; S.basket=S.basket.filter(x=>x.label!==o.label); placeOrders([o]); });
  paintBasket();
}

function toggleBasket(o){
  if(!o) return;
  S.basket = S.basket.some(b=>b.label===o.label) ? S.basket.filter(b=>b.label!==o.label) : S.basket.concat([o]);
  paintOrders();
}

function paintBasket(){
  const bar=$('basketBar'); if(!bar) return;
  if(!S.basket.length){ bar.innerHTML=''; return; }
  bar.innerHTML=`<div class="border-t-2 border-emerald-500/40 bg-slate-950/98 p-4 md:px-6 space-y-3 shadow-[0_-16px_40px_rgba(2,6,23,.9)]">

      <span class="text-[10px] font-black uppercase tracking-widest text-slate-500">Order set · ${S.basket.length} item${S.basket.length===1?'':'s'}</span>
      <button id="clearBasket" class="text-[10px] font-black uppercase tracking-widest text-slate-600 hover:text-red-400 transition">Clear</button>
    </div>
    <div class="flex flex-wrap gap-2">${S.basket.map((o,i)=>`<button data-rm="${i}" class="rmBtn px-3 py-1.5 rounded-xl text-[10px] font-black uppercase tracking-widest border ${o.critical?'bg-red-500/10 border-red-500/40 text-red-300':'bg-slate-900 border-slate-700 text-slate-300'}">${esc(o.label)} ×</button>`).join('')}</div>
    <button id="signBtn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 rounded-2xl transition">Sign &amp; send ${S.basket.length} order${S.basket.length===1?'':'s'}</button>
  </div>`;
  $('clearBasket').onclick=()=>{ S.basket=[]; paintOrders(); };
  document.querySelectorAll('.rmBtn').forEach(b=>b.onclick=()=>{ S.basket.splice(+b.dataset.rm,1); paintOrders(); });
  $('signBtn').onclick=()=>{ const o=S.basket; S.basket=[]; placeOrders(o); };
}

/** Send one or more catalogue orders as a single signed action. */
function placeOrders(orders){
  orders=(orders||[]).filter(Boolean);
  if(!orders.length||S.loading) return;
  const text = orders.length===1 ? orders[0].detail
    : 'Order set — carry these out now:\n' + orders.map((o,i)=>`${i+1}. ${o.detail}`).join('\n');
  S.view='sim'; renderTabs(); renderView();
  progress(text, orders.map(o=>({label:o.label, category:o.category, critical:!!o.critical})));
}

              </div>
              <div class="flex gap-1 shrink-0">
                ${CONF.map(([c,lbl])=>`<button data-dx="${i}" data-conf="${c}" class="confBtn px-2.5 py-1.5 rounded-lg text-[9px] font-black uppercase tracking-widest border transition ${d.confidence===c?(c==='ruled-out'?'bg-slate-800 border-slate-700 text-slate-400':'bg-fuchsia-500/15 border-fuchsia-500/40 text-fuchsia-300'):'bg-slate-950 border-slate-800 text-slate-600 hover:text-slate-300'}">${lbl}</button>`).join('')}
                <button data-rmdx="${i}" class="rmDx px-2 py-1.5 rounded-lg text-slate-700 hover:text-red-400 transition">×</button>
              </div>
            </div>`).join('')
            : `<p class="text-xs text-slate-600 leading-relaxed py-2">Nothing on the differential yet. Add every diagnosis you are genuinely carrying — the debrief scores the breadth of your differential, not just the final answer.</p>`}
        </div>
        <div class="space-y-2">
          <div class="text-[10px] font-black uppercase tracking-widest text-slate-500">Common ER differentials</div>
          <div class="flex flex-wrap gap-2">
            ${COMMON_DX.filter(n=>!S.dx.some(d=>d.name.toLowerCase()===n.toLowerCase())).map(n=>`<button data-add="${esc(n)}" class="addDx px-3 py-1.5 rounded-xl bg-slate-900/50 border border-slate-800 text-[10px] font-bold uppercase tracking-widest text-slate-500 hover:text-fuchsia-400 hover:border-fuchsia-500/30 transition">+ ${esc(n)}</button>`).join('')}
          </div>
        </div>
        <button id="dxDoc" class="w-full bg-fuchsia-600 hover:bg-fuchsia-500 disabled:opacity-30 text-white font-bold py-4 rounded-2xl transition" ${active.length?'':'disabled'}>Document differential in the chart</button>
        <p class="text-[11px] text-slate-600 text-center leading-relaxed">Documenting tells the team what you are thinking, drives the engine's responses, and is what the debrief grades your differential against. You can revise it as often as you like.</p>
      </div>
    </div>`;
  wireBack();
  const input=$('dxInput');
  const add=()=>{ if(addDx(input.value)) { input.value=''; renderDx(); renderTabs(); } };
  $('dxAdd').onclick=add;
  input.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); add(); } });
  document.querySelectorAll('.addDx').forEach(b=>b.onclick=()=>{ addDx(b.dataset.add); renderDx(); renderTabs(); });
  document.querySelectorAll('.confBtn').forEach(b=>b.onclick=()=>{ setConfidence(+b.dataset.dx, b.dataset.conf); renderDx(); renderTabs(); renderWorkspace(); });
  document.querySelectorAll('.rmDx').forEach(b=>b.onclick=()=>{ S.dx.splice(+b.dataset.rmdx,1); renderDx(); renderTabs(); renderWorkspace(); });
  $('dxDoc').onclick=documentDifferential;
}

function addDx(name){
  const clean=(name||'').trim();
  if(!clean || S.dx.some(d=>d.name.toLowerCase()===clean.toLowerCase())) return false;
  S.dx.push({ name:clean, confidence: S.dx.length?'considering':'leading', submitted:false });
  return true;
}
function setConfidence(i, conf){
  if(!S.dx[i]) return;
  // Only one diagnosis can lead the differential at a time.
  if(conf==='leading') S.dx.forEach(d=>{ if(d.confidence==='leading') d.confidence='considering'; });
  S.dx[i].confidence=conf;
}
function documentDifferential(){
  const active=S.dx.filter(d=>d.confidence!=='ruled-out');
  if(!active.length||S.loading) return;
  const leading=active.filter(d=>d.confidence==='leading').map(d=>d.name);
  const rest=active.filter(d=>d.confidence!=='leading').map(d=>d.name);
  const out=S.dx.filter(d=>d.confidence==='ruled-out').map(d=>d.name);
  const parts=[
    leading.length?`Leading diagnosis: ${leading.join(', ')}.`:'',
    rest.length?`Also actively considering: ${rest.join('; ')}.`:'',
    out.length?`Considered and ruled out: ${out.join('; ')}.`:''
  ].filter(Boolean);
  S.dx.forEach(d=>d.submitted=true);
  S.view='sim'; renderTabs(); renderView();
  progress('Documenting my working differential. '+parts.join(' '),
    [{label:`Differential — ${active.length} dx`, category:'other'}]);
}
function differentialForPrompt(){
  return S.dx.filter(d=>d.confidence!=='ruled-out')
    .map(d=>d.confidence==='leading'?`${d.name} (leading)`:d.name);
}

// ---------- CHART ----------
const LOG_FILTERS=[['all','All'],['medication','Meds'],['lab','Labs'],['imaging','Imaging'],['procedure','Procedures'],['critical','Critical']];
const LOG_DOT={critical:'bg-red-500',medication:'bg-purple-500',lab:'bg-yellow-500',imaging:'bg-emerald-500',procedure:'bg-blue-500',exam:'bg-blue-400',history:'bg-slate-400',consult:'bg-cyan-500',disposition:'bg-orange-500',other:'bg-slate-500'};
const LOG_TEXT={critical:'text-red-400',medication:'text-purple-400',lab:'text-yellow-400',imaging:'text-emerald-400',procedure:'text-blue-400',exam:'text-blue-300',history:'text-slate-300',consult:'text-cyan-400',disposition:'text-orange-400',other:'text-slate-400'};

function chartHTML(){
  let h='';
  if(S.dx.length){
    h+=section('Working Differential','fuchsia', `<div class="flex flex-wrap gap-2">${S.dx.map(d=>`<span class="px-3 py-1.5 rounded-xl text-xs font-bold border ${d.confidence==='leading'?'bg-fuchsia-500/10 border-fuchsia-500/40 text-fuchsia-300':d.confidence==='ruled-out'?'bg-slate-900/40 border-slate-800 text-slate-600 line-through':'bg-slate-900/60 border-slate-700 text-slate-300'}">${d.confidence==='leading'?'<span class="text-[9px] uppercase tracking-widest mr-1">Leading ·</span>':''}${esc(d.name)}</span>`).join('')}</div>`);
  }
  if(S.orderLog.length){
    const shown = S.logFilter==='all' ? S.orderLog
      : S.logFilter==='critical' ? S.orderLog.filter(o=>o.critical||o.category==='critical')
      : S.orderLog.filter(o=>o.category===S.logFilter);
    h+=section('Orders & Meds Given','purple',
      `<div class="flex flex-wrap gap-1.5 mb-2">${LOG_FILTERS.map(([id,lbl])=>`<button data-lf="${id}" class="lfBtn px-2.5 py-1 rounded-lg text-[9px] font-black uppercase tracking-widest border transition ${S.logFilter===id?'bg-purple-500/15 border-purple-500/40 text-purple-300':'bg-slate-900/50 border-slate-800 text-slate-600 hover:text-slate-300'}">${lbl}</button>`).join('')}</div>
       <div class="bg-slate-900/40 rounded-xl divide-y divide-slate-800/50">${
        shown.length ? shown.map(o=>`<div class="px-3 py-2.5 flex items-start gap-2">
          <span class="w-1.5 h-1.5 rounded-full mt-1.5 shrink-0 ${LOG_DOT[o.category]||LOG_DOT.other}"></span>
          <div class="min-w-0 flex-1">
            <div class="flex items-baseline justify-between gap-2"><span class="text-xs font-bold text-slate-200 truncate">${esc(o.label)}</span><span class="text-[9px] mono text-slate-600 shrink-0">${o.time}</span></div>
            <span class="text-[9px] font-black uppercase tracking-widest ${LOG_TEXT[o.category]||LOG_TEXT.other}">${esc(CATEGORY_LABELS[o.category]||'Order')}</span>
          </div></div>`).join('')
        : '<p class="px-3 py-2.5 text-xs text-slate-600">Nothing in this category yet.</p>'}</div>`);
  }
  if(S.exam.length){ h+=section('Physical Exam','blue', S.exam.map(e=>`<div class="p-3 bg-slate-900/40 rounded-xl border-l-2 border-blue-600"><span class="text-[9px] font-black text-slate-500 uppercase tracking-widest">${esc(e.system)}</span><p class="text-sm text-slate-200 mt-1">${esc(e.finding)}</p></div>`).join('')); }
  if(S.reports.length){ h+=section('Imaging','emerald', S.reports.map(r=>`<div class="p-3 bg-slate-900/40 rounded-xl border-l-2 border-emerald-600"><span class="text-[9px] font-black text-emerald-400 uppercase tracking-widest">${esc(r.title)}</span><p class="text-sm text-slate-200 mt-1">${esc(r.body)}</p></div>`).join('')); }
  if(S.labs.length){ h+=section('Laboratory','yellow', `<div class="bg-slate-900/40 rounded-xl divide-y divide-slate-800/50">${S.labs.map(l=>`<div class="flex justify-between px-3 py-2"><span class="text-xs text-slate-300">${esc(l.name)}</span><span class="text-xs font-bold ${l.flag?'text-red-500':'text-emerald-500'}">${esc(String(l.value))} <span class="text-[9px] text-slate-600 uppercase">${esc(l.unit||'')}</span></span></div>`).join('')}</div>`); }
  return h;
}

function wireLogFilters(){
  document.querySelectorAll('.lfBtn').forEach(b=>b.onclick=()=>{ S.logFilter=b.dataset.lf; renderWorkspace(); if(S.view==='chart') renderChartView(); });
}

function renderWorkspace(){
  const ws=$('ws'); if(!ws) return;
  ws.innerHTML = chartHTML() || `<p class="text-xs text-slate-600">Order labs, imaging, or an exam to populate the chart.</p>`;
  wireLogFilters();
}

function renderChartView(){
  $('viewBody').innerHTML=`
    <div class="px-4 md:px-6 pt-4 pb-3 border-b border-slate-900 shrink-0 flex items-center justify-between gap-4">
      <div>
        <h2 class="text-base font-black uppercase italic tracking-tight">Patient <span class="text-blue-500 not-italic">Chart</span></h2>
        <p class="text-[10px] text-slate-500 font-bold uppercase tracking-widest">Orders &amp; meds given · exam · imaging · labs</p>
      </div>
      ${backBtn()}
    </div>
    <div class="flex-1 min-h-0 overflow-y-auto p-4 md:p-6"><div class="max-w-3xl mx-auto">${chartHTML() || '<p class="text-xs text-slate-600">The chart is empty. Place an order, examine the patient, or document a differential and everything you do will collect here.</p>'}</div></div>`;
  wireBack(); wireLogFilters();
}

function vbox(label,id,unit){
  return `<div class="bg-slate-900/40 border border-slate-800/50 rounded-2xl p-2 md:p-3 flex flex-col justify-between">
    <span class="text-[8px] md:text-[10px] font-black uppercase tracking-widest text-slate-500">${label}</span>
    <div class="flex items-baseline gap-1 mt-1"><span id="${id}" class="text-3xl font-black mono text-emerald-500">--</span><span class="text-[9px] text-slate-600 font-bold uppercase">${unit}</span></div>
  </div>`;
}
function renderChat(){
  const c=$('chat'); if(!c) return;
  c.innerHTML=S.messages.map(m=>{
    if(m.role==='user') return `<div class="flex justify-end fade"><div class="max-w-[80%] bg-blue-600/10 border border-blue-500/20 rounded-3xl rounded-tr-none p-4 text-sm text-blue-100 whitespace-pre-wrap">${esc(m.content)}</div></div>`;
    return `<div class="flex gap-3 fade"><div class="w-9 h-9 rounded-2xl bg-emerald-600/10 border border-emerald-500/20 flex items-center justify-center text-emerald-500 shrink-0">
      <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="5" r="2"/><path d="M12 7v4"/></svg></div>
      <div class="max-w-[80%] bg-slate-900/80 border border-slate-800 rounded-3xl rounded-tl-none p-4 text-sm text-slate-200">
        <div class="whitespace-pre-wrap leading-relaxed">${esc(m.content)}</div>
        ${m.rationale?`<details class="mt-3 pt-3 border-t border-slate-800/50"><summary class="text-[10px] font-black uppercase tracking-widest text-emerald-500/60 cursor-pointer">Clinical rationale</summary><div class="mt-2 text-xs text-slate-400 italic mono">${esc(m.rationale)}</div></details>`:''}
      </div></div>`;
  }).join('') + (S.loading?`<div class="flex gap-3"><div class="w-9 h-9 rounded-2xl bg-emerald-600/10 border border-emerald-500/20 flex items-center justify-center"><span class="w-2 h-2 bg-emerald-500 rounded-full pulse-dot"></span></div><div class="bg-slate-900/50 border border-slate-800 rounded-2xl px-4 py-3 text-[10px] text-emerald-500 font-black uppercase tracking-widest">Processing clinical logic…</div></div>`:'');
  c.scrollTop=c.scrollHeight;
}
function section(title,color,inner){ return `<div class="space-y-2 mb-6"><div class="text-[10px] font-black uppercase tracking-widest text-${color}-500">${title}</div>${inner}</div>`; }

// ===================== RENDER: DEBRIEF =====================
function renderDebrief(){
  const d=S.debrief||{}; const score=Math.round(d.score||0);
  clearInterval(driftTimer); cancelAnimationFrame(ecgRAF);
  const ev=Array.isArray(d.criticalEvents)?d.criticalEvents:[];
  main.innerHTML=`
  <div class="flex-1 overflow-y-auto p-6">
    <div class="max-w-3xl mx-auto fade space-y-6">
      <div class="text-center py-6">
        <div class="text-[10px] font-black uppercase tracking-[.3em] text-slate-500 mb-2">Case Debrief — ${esc(S.diagnosis)}</div>
        <div class="text-[9px] font-black uppercase tracking-[.25em] text-slate-600 mb-2">Marked at ${esc(getLevel(S.level).label)} level</div>
        <div class="text-7xl font-black mono ${score>=80?'text-emerald-500':score>=60?'text-yellow-500':'text-red-500'}">${score}<span class="text-2xl text-slate-600">/100</span></div>
        <div class="text-lg font-bold text-white mt-1">${esc(d.outcome||'Case complete')}</div>
      </div>
      <div class="bg-slate-900/50 border border-slate-800 rounded-2xl p-5 text-sm text-slate-300 leading-relaxed">${esc(d.summary||'')}</div>
      ${S.dx.length?`<div class="space-y-2">
        <h3 class="text-[10px] font-black uppercase tracking-widest text-fuchsia-400">Your Differential</h3>
        <div class="flex flex-wrap gap-2">${S.dx.map(x=>{
          const truth=(S.diagnosis||'').toLowerCase(), guess=x.name.toLowerCase();
          const hit = truth && (truth.includes(guess)||guess.includes(truth));
          return `<span class="px-3 py-1.5 rounded-xl text-xs font-bold border ${hit?'bg-emerald-500/10 border-emerald-500/40 text-emerald-300':x.confidence==='ruled-out'?'bg-slate-900/40 border-slate-800 text-slate-600 line-through':'bg-slate-900/60 border-slate-700 text-slate-300'}">${hit?'✓ ':''}${esc(x.name)}${x.confidence==='leading'?' <span class="text-[9px] uppercase tracking-widest opacity-60">Leading</span>':''}</span>`;
        }).join('')}</div>
        ${d.diagnosisReview?`<p class="text-xs text-slate-400 leading-relaxed pt-1">${esc(d.diagnosisReview)}</p>`:''}
      </div>`:''}
      ${ev.length?`<div class="space-y-2"><h3 class="text-[10px] font-black uppercase tracking-widest text-slate-500">Critical Events</h3>${ev.map(e=>`<div class="p-4 bg-slate-900/40 border border-slate-800 rounded-xl border-l-4 ${e.type==='positive'?'border-l-emerald-600':e.type==='negative'?'border-l-red-600':'border-l-slate-600'}"><div class="text-sm font-bold ${e.type==='positive'?'text-emerald-400':e.type==='negative'?'text-red-400':'text-slate-300'}">${esc(e.event)}</div><p class="text-xs text-slate-400 mt-1">${esc(e.feedback)}</p></div>`).join('')}</div>`:''}
      ${arrSec('Missed Opportunities','red',d.missedOpportunities)}
      ${arrSec('Key Learning Points','emerald',d.learningPoints&&d.learningPoints.length?d.learningPoints:S.learningPoints)}
      <div class="flex gap-3 pt-2">
        <button id="dlBtn" class="flex-1 bg-slate-800 hover:bg-slate-700 text-white font-bold py-3 rounded-xl transition">Download report</button>
        <button id="newBtn" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl transition">New case</button>
      </div>
    </div>
  </div>`;
  $('newBtn').onclick=()=>renderSetup();
  $('dlBtn').onclick=()=>downloadReport(d,score);
}
function arrSec(title,color,arr){
  if(!Array.isArray(arr)||!arr.length) return '';
  return `<div class="space-y-2"><h3 class="text-[10px] font-black uppercase tracking-widest text-${color}-500">${title}</h3><ul class="space-y-1">${arr.map(x=>`<li class="text-xs text-slate-300 flex gap-2"><span class="text-${color}-500">•</span>${esc(x)}</li>`).join('')}</ul></div>`;
}
function downloadReport(d,score){
  const txt=`MEDISIM ER — CASE REPORT
Diagnosis: ${S.diagnosis}
Training level: ${getLevel(S.level).label}
Your differential: ${S.dx.length?S.dx.map(x=>x.name+(x.confidence==='leading'?' (leading)':x.confidence==='ruled-out'?' (ruled out)':'')).join('; '):'none documented'}
Outcome: ${d.outcome||''}
Score: ${score}/100

SUMMARY
${d.summary||''}

MISSED OPPORTUNITIES
${(d.missedOpportunities||[]).map(x=>'- '+x).join('\n')}

LEARNING POINTS
${((d.learningPoints&&d.learningPoints.length?d.learningPoints:S.learningPoints)||[]).map(x=>'- '+x).join('\n')}`;
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([txt],{type:'text/plain'}));
  a.download='MediSim_'+S.diagnosis.replace(/\s+/g,'_')+'.txt'; a.click();
}

// ===================== HELPERS =====================
function esc(s){ return String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function setLoading(on,hint){ S.loading=on;
  if(S.stage==='setup'){ const b=$('genBtn'); if(b){b.disabled=on;b.textContent=on?'Generating…':'Generate Case →';} if(hint&&$('setupHint'))$('setupHint').textContent=hint; }
  else renderChat();
}
function showError(msg){
  if(S.stage==='setup'){ if($('setupHint')) $('setupHint').innerHTML=`<span class="text-red-400">⚠ ${esc(msg)}</span>`; }
  else { S.messages.push({role:'assistant',content:'⚠ '+msg}); renderChat(); }
}

// ===================== CONNECTION TEST / DETECT =====================
async function testConnection(silent){
  try{
    const res=await fetch(S.baseURL.replace(/\/+$/,'')+'/models');
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data=await res.json();
    const ids=(data.data||[]).map(m=>m.id);
    $('connDot').className='w-1.5 h-1.5 rounded-full bg-emerald-500 pulse-dot';
    $('connText').textContent='Local Engine: connected';
    if(!silent && $('detectMsg')) $('detectMsg').innerHTML='<span class="text-emerald-400">Connected. Models: '+esc(ids.join(', ')||'(none loaded)')+'</span>';
    if(!S.model && ids[0]){ S.model=ids[0]; if($('model'))$('model').value=ids[0]; localStorage.setItem('ms_model',ids[0]); }
    if(S.stage==='setup'&&$('setupHint')&&!$('setupHint').textContent) $('setupHint').textContent='Connected to local model — ready.';
    return ids;
  }catch(e){
    $('connDot').className='w-1.5 h-1.5 rounded-full bg-red-500';
    $('connText').textContent='Local Engine: offline';
    if(!silent && $('detectMsg')) $('detectMsg').innerHTML='<span class="text-red-400">Cannot reach '+esc(S.baseURL)+'. Start the server in LM Studio and enable CORS.</span>';
    if(S.stage==='setup'&&$('setupHint')) $('setupHint').innerHTML='<span class="text-slate-500">Tip: open Settings ⚙ and connect to LM Studio first.</span>';
    return null;
  }
}

// ===================== SPEECH RECOGNITION (dictation) =====================
let recog=null;
function startDictation(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ alert('Voice dictation is not supported in this browser.'); return; }
  if(!recog){ recog=new SR(); recog.lang='en-US'; recog.interimResults=false;
    recog.onresult=e=>{ const t=e.results[0][0].transcript.replace(/\.$/,''); const c=$('cmd'); if(c){c.value=(c.value?c.value+' ':'')+t;} };
  }
  try{ recog.start(); }catch(_){}
}

// ===================== SETTINGS WIRING =====================
$('settingsBtn').onclick=()=>{ openSettings(); };
$('closeSettings').onclick=()=>{ $('settingsModal').classList.add('hidden'); $('settingsModal').classList.remove('flex'); };
function openSettings(){
  $('baseURL').value=S.baseURL; $('model').value=S.model; $('temp').value=S.temperature; $('tempVal').textContent=S.temperature;
  $('settingsModal').classList.remove('hidden'); $('settingsModal').classList.add('flex');
}
$('baseURL').addEventListener('change',e=>{ S.baseURL=e.target.value.trim(); localStorage.setItem('ms_baseURL',S.baseURL); });
$('model').addEventListener('change',e=>{ S.model=e.target.value.trim(); localStorage.setItem('ms_model',S.model); });
$('temp').addEventListener('input',e=>{ S.temperature=parseFloat(e.target.value); $('tempVal').textContent=S.temperature; localStorage.setItem('ms_temp',S.temperature); });
$('detectBtn').onclick=()=>{ S.baseURL=$('baseURL').value.trim(); testConnection(false); };
$('testBtn').onclick=()=>{ S.baseURL=$('baseURL').value.trim(); localStorage.setItem('ms_baseURL',S.baseURL); testConnection(false); };
$('ttsBtn').onclick=()=>{ S.tts=!S.tts; localStorage.setItem('ms_tts',S.tts?'1':'0'); if(!S.tts&&'speechSynthesis'in window) speechSynthesis.cancel();
  $('ttsBtn').className='p-2.5 rounded-xl border transition '+(S.tts?'bg-emerald-500/10 border-emerald-500/40 text-emerald-400':'bg-slate-900 border-slate-800 text-slate-500'); };
$('resetBtn').onclick=()=>{ if('speechSynthesis'in window)speechSynthesis.cancel(); clearInterval(driftTimer); cancelAnimationFrame(ecgRAF); renderSetup(); };

// init
if(!S.tts) $('ttsBtn').className='p-2.5 rounded-xl border transition bg-slate-900 border-slate-800 text-slate-500';
renderSetup();
</script>
