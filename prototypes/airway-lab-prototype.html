<title>Airway Lab Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
/* Layout: one procedure stage. The main view (video-laryngoscope monitor or sagittal cutaway) sits between
   a slim step bar and a bottom dock; the other view floats as a picture-in-picture you can swap.
   Deliberately a single dark look: it is a dim resus bay lit by a monitor. */
:root {
  --bg: #0e1315;
  --panel: rgba(17, 23, 26, 0.86);
  --line: rgba(150, 185, 182, 0.18);
  --fg: #e6ecea;
  --muted: #8f9e9c;
  --accent: #8fd0c4;
  --accent-ink: #0b1614;
  --warn: #f0b35e;
  --bad: #ef8a78;
  --good: #a3d68f;
  --bezel: #1b2124;
  --f-display: 'IBM Plex Sans Condensed', 'Arial Narrow', system-ui, sans-serif;
  --f-body: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.4 var(--f-body); overflow: hidden; }
#app { position: relative; height: 100%; overflow: hidden; }
#stage { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }

.bar { position: absolute; inset: 0 0 auto 0; display: flex; gap: 8px 16px; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: 10px 16px; pointer-events: none; }
.bar > * { pointer-events: auto; }
.brand h1 { margin: 0; font: 600 19px/1.1 var(--f-display); letter-spacing: 0.01em; }
.brand p { margin: 2px 0 0; color: var(--muted); font-size: 12px; }
.steps { display: flex; gap: 4px; margin: 0; padding: 3px; list-style: none; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; counter-reset: step; }
.steps li { counter-increment: step; display: flex; align-items: center; gap: 6px; padding: 6px 11px 6px 7px; border-radius: 999px; font: 500 12.5px/1 var(--f-body); color: var(--muted); white-space: nowrap; }
.steps li::before { content: counter(step); display: grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; border: 1px solid var(--line); font: 500 11px/1 var(--f-mono); }
.steps li[data-state="current"] { background: var(--accent); color: var(--accent-ink); }
.steps li[data-state="current"]::before { border-color: rgba(11, 22, 20, 0.35); }
.steps li[data-state="done"] { color: var(--fg); }
.steps li[data-state="done"]::before { content: '✓'; background: rgba(143, 208, 196, 0.18); border-color: transparent; color: var(--accent); }
.btn { appearance: none; font: 500 13px/1 var(--f-body); color: var(--fg); background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 9px 14px; cursor: pointer; }
.btn:hover { border-color: rgba(150, 185, 182, 0.4); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:disabled { background: transparent; color: var(--muted); border-color: var(--line); cursor: not-allowed; }
.btn:focus-visible, input:focus-visible, .frame.pip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.frame { position: absolute; pointer-events: none; border-radius: 12px; box-shadow: 0 0 0 7px var(--bezel), 0 0 0 8px rgba(255, 255, 255, 0.06), 0 18px 40px rgba(0, 0, 0, 0.45); }
.frame .tag { position: absolute; left: 10px; top: 8px; font: 500 10.5px/1 var(--f-mono); letter-spacing: 0.08em; text-transform: uppercase; color: rgba(230, 236, 234, 0.8); background: rgba(8, 12, 13, 0.55); padding: 4px 6px; border-radius: 4px; }
.frame .rec { position: absolute; left: 10px; bottom: 8px; font: 500 10.5px/1 var(--f-mono); color: rgba(230, 236, 234, 0.75); background: rgba(8, 12, 13, 0.55); padding: 4px 6px; border-radius: 4px; }
.frame.pip { pointer-events: auto; cursor: pointer; background: transparent; border: 0; padding: 0; border-radius: 8px; box-shadow: 0 0 0 3px var(--bezel), 0 0 0 4px rgba(255, 255, 255, 0.1), 0 10px 26px rgba(0, 0, 0, 0.5); }
.frame.pip .swap { position: absolute; right: 6px; bottom: 6px; font: 500 10.5px/1 var(--f-body); color: var(--fg); background: rgba(8, 12, 13, 0.7); padding: 5px 7px; border-radius: 999px; }

.dock { position: absolute; inset: auto 0 0 0; display: flex; flex-direction: column; gap: 8px; align-items: center; padding: 8px 16px calc(12px + env(safe-area-inset-bottom, 0px)); pointer-events: none; }
.dock > * { pointer-events: auto; width: 100%; max-width: 820px; }
.coach { display: flex; gap: 10px; align-items: flex-start; padding: 9px 12px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); font-size: 13.5px; }
.coach .dot { flex: none; width: 8px; height: 8px; margin-top: 6px; border-radius: 50%; background: var(--accent); }
.coach[data-tone="warn"] .dot { background: var(--warn); }
.coach[data-tone="bad"] .dot { background: var(--bad); }
.coach[data-tone="good"] .dot { background: var(--good); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.chip { font: 500 12px/1 var(--f-mono); font-variant-numeric: tabular-nums; padding: 6px 9px; border-radius: 6px; background: var(--panel); border: 1px solid var(--line); color: var(--fg); white-space: nowrap; }
.chip b { font-weight: 400; color: var(--muted); margin-right: 6px; text-transform: uppercase; letter-spacing: 0.06em; font-size: 10.5px; }
.chip[data-tone="warn"] { border-color: rgba(240, 179, 94, 0.55); }
.chip[data-tone="bad"] { border-color: rgba(239, 138, 120, 0.7); color: var(--bad); }
.chip[data-tone="good"] { border-color: rgba(163, 214, 143, 0.55); }
.panel { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 6px 18px; padding: 10px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; }
.ctl { display: grid; gap: 2px; font-size: 12px; color: var(--muted); min-width: 0; }
.ctl .row { display: flex; justify-content: space-between; gap: 8px; }
.ctl .val { font-family: var(--f-mono); font-variant-numeric: tabular-nums; color: var(--fg); }
input[type="range"] { width: 100%; margin: 0; accent-color: var(--accent); height: 22px; }
.actions { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.actions .result { flex: 1 1 100%; }
.actions .hint { flex: 1 1 220px; font-size: 11.5px; color: var(--muted); }
.hint kbd { font: 500 10.5px/1 var(--f-mono); padding: 2px 5px; border: 1px solid var(--line); border-radius: 4px; color: var(--fg); }
#capno-wrap { display: grid; gap: 4px; padding: 8px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
#capno-wrap .row { display: flex; justify-content: space-between; font: 500 11px/1 var(--f-mono); color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; }
#capno-wrap .row span:last-child { color: #f3d34a; }
#capno { width: 100%; height: 64px; display: block; }
.result { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 6px 14px; grid-column: 1 / -1; }
.result div { display: grid; gap: 2px; }
.result b { font: 500 10.5px/1.2 var(--f-mono); color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; }
.result span { font: 500 15px/1.2 var(--f-mono); font-variant-numeric: tabular-nums; }
@media (orientation: landscape) and (max-height: 540px) {
  .brand { display: none; }
  .dock { inset: 0 0 0 auto; width: min(380px, 46vw); justify-content: flex-end; padding: 58px 12px calc(10px + env(safe-area-inset-bottom, 0px)); overflow-y: auto; }
  .dock > * { max-width: none; }
  .panel { grid-template-columns: 1fr 1fr; padding: 8px 12px; gap: 2px 14px; }
  .actions .hint { display: none; }
}
#status { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font: 500 13px var(--f-mono); pointer-events: none; }
@media (max-width: 620px) {
  .brand p { display: none; }
  .steps li { padding: 5px 7px 5px 5px; font-size: 0; gap: 0; }
  .steps li[data-state="current"] { font-size: 12px; gap: 5px; padding-right: 9px; }
  .panel { grid-template-columns: 1fr 1fr; padding: 8px 12px; gap: 2px 14px; }
  .actions .hint { display: none; }
  .coach { font-size: 13px; }
}
</style>

<div id="app">
  <canvas id="stage" aria-label="Intubation simulator"></canvas>
  <div id="status">Loading…</div>

  <header class="bar">
    <div class="brand">
      <h1>Airway Lab</h1>
      <p>Video laryngoscopy with a hyperangulated blade and rigid stylet</p>
    </div>
    <ol class="steps" id="steps" aria-label="Procedure steps">
      <li data-step="mouth">Open the mouth</li>
      <li data-step="blade">Get the view</li>
      <li data-step="tube">Pass the tube</li>
      <li data-step="secure">Secure &amp; confirm</li>
    </ol>
    <button class="btn" id="restart">Restart</button>
  </header>

  <div class="frame" id="frame-main"><span class="tag" id="tag-main">Cutaway</span><span class="rec" id="rec-main"></span></div>
  <button class="frame pip" id="frame-pip" aria-label="Swap views"><span class="tag" id="tag-pip">Monitor</span><span class="swap">Swap ⇄</span></button>

  <div class="dock" id="dock">
    <div class="coach" id="coach"><span class="dot"></span><span id="coach-text"></span></div>
    <div class="chips" id="chips"></div>
    <div id="capno-wrap" hidden><div class="row"><span>EtCO₂</span><span id="capno-val">— mmHg</span></div><canvas id="capno" width="800" height="64"></canvas></div>
    <div class="panel" id="panel"></div>
  </div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
} }
</script>

<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const V3 = THREE.Vector3, TAU = Math.PI * 2;
const $ = (id) => document.getElementById(id);
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

// ---------------------------------------------------------------- procedural textures and geometry helpers
function rng(seed) { let s = seed; return () => ((s = (s * 16807) % 2147483647) - 1) / 2147483646; }
// Sum of sinusoids with integer frequencies: organic-looking and perfectly tileable.
function tileNoise(seed, n, maxF, falloff) {
  const r = rng(seed), cs = [];
  for (let k = 0; k < n; k++) {
    let fx = Math.round((r() * 2 - 1) * maxF), fy = Math.round((r() * 2 - 1) * maxF);
    if (!fx && !fy) fx = 1;
    cs.push([fx, fy, r() * TAU, 1 / Math.pow(Math.hypot(fx, fy), falloff)]);
  }
  return (u, v) => { let s = 0; for (const c of cs) s += c[3] * Math.sin(TAU * (c[0] * u + c[1] * v) + c[2]); return s; };
}
function normalize01(arr) { let lo = Infinity, hi = -Infinity; for (const x of arr) { lo = Math.min(lo, x); hi = Math.max(hi, x); } for (let i = 0; i < arr.length; i++) arr[i] = (arr[i] - lo) / (hi - lo); }

function drawVessels(ctx, S, seed, count, width) {
  const r = rng(seed);
  const seg = (x0, y0, x1, y1) => { for (const ox of [-S, 0, S]) for (const oy of [-S, 0, S]) { ctx.beginPath(); ctx.moveTo(x0 + ox, y0 + oy); ctx.lineTo(x1 + ox, y1 + oy); ctx.stroke(); } };
  const grow = (x, y, ang, w, depth) => {
    const steps = 16 + Math.floor(r() * 30);
    for (let s = 0; s < steps; s++) {
      ang += (r() - 0.5) * 0.55;
      const nx = x + Math.cos(ang) * 5, ny = y + Math.sin(ang) * 5;
      ctx.lineWidth = w; seg(x, y, nx, ny); x = nx; y = ny; w *= 0.982;
      if (depth < 3 && r() < 0.07) grow(x, y, ang + (r() < 0.5 ? -1 : 1) * (0.5 + r() * 0.7), w * 0.68, depth + 1);
    }
  };
  ctx.lineCap = 'round';
  for (let i = 0; i < count; i++) grow(r() * S, r() * S, r() * TAU, width * (0.6 + r() * 0.6), 0);
}

function makeMucosa(S = 512) {
  const fineN = tileNoise(3, 44, 26, 0.85), blotN = tileNoise(5, 22, 5, 1.1);
  const fine = new Float32Array(S * S), blot = new Float32Array(S * S);
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) { const i = y * S + x; fine[i] = fineN(x / S, y / S); blot[i] = blotN(x / S, y / S); }
  normalize01(fine); normalize01(blot);
  const mk = () => { const c = document.createElement('canvas'); c.width = c.height = S; return c; };
  const colC = mk(), bumpC = mk(), cx = colC.getContext('2d'), bx = bumpC.getContext('2d');
  const ci = cx.createImageData(S, S), bi = bx.createImageData(S, S);
  const dark = [168, 74, 76], light = [226, 146, 136];
  for (let i = 0; i < S * S; i++) {
    const t = blot[i], f = (fine[i] - 0.5) * 22;
    ci.data[i * 4] = lerp(dark[0], light[0], t) + f; ci.data[i * 4 + 1] = lerp(dark[1], light[1], t) + f * 0.7; ci.data[i * 4 + 2] = lerp(dark[2], light[2], t) + f * 0.6; ci.data[i * 4 + 3] = 255;
    const g = 128 + (fine[i] - 0.5) * 150 + (blot[i] - 0.5) * 40;
    bi.data[i * 4] = bi.data[i * 4 + 1] = bi.data[i * 4 + 2] = g; bi.data[i * 4 + 3] = 255;
  }
  cx.putImageData(ci, 0, 0); bx.putImageData(bi, 0, 0);
  cx.strokeStyle = 'rgba(120, 22, 40, 0.28)'; drawVessels(cx, S, 17, 12, 2.4);
  cx.strokeStyle = 'rgba(150, 40, 60, 0.18)'; drawVessels(cx, S, 29, 18, 1.2);
  bx.strokeStyle = 'rgba(255, 255, 255, 0.22)'; drawVessels(bx, S, 17, 12, 2.4);
  const tex = (c, srgb) => { const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 8; if (srgb) t.colorSpace = THREE.SRGBColorSpace; return t; };
  return { map: tex(colC, true), bump: tex(bumpC, false) };
}

// Printed markings, radiopaque stripe and inflation lumen for the ETT. u = distance from tip (0–34 cm), v = around.
function makeTubeMarkings() {
  const W = 2048, H = 128, PX = W / 34;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d');
  g.fillStyle = '#2d6fd8'; g.fillRect(0, 58, W, 9);                       // radiopaque line
  g.fillStyle = 'rgba(255,255,255,0.28)'; g.fillRect(4.4 * PX, 100, 23 * PX, 4); // inflation lumen
  g.fillStyle = 'rgba(18,20,26,0.92)'; g.strokeStyle = 'rgba(18,20,26,0.92)'; g.lineWidth = 2;
  for (let cm = 12; cm <= 30; cm++) {
    const x = W - cm * PX;           // flipped so numbers read from the tip toward the connector
    g.fillRect(x - 1, 14, 2, cm % 2 ? 7 : 12);
    if (cm % 2 === 0) { g.save(); g.translate(x, 44); g.scale(1.45, 1); g.font = '600 17px Arial, Helvetica, sans-serif'; g.textAlign = 'center'; g.fillText(String(cm), 0, 0); g.restore(); }
  }
  g.save(); g.translate(W - 25 * PX, 92); g.scale(1.45, 1); g.font = '600 15px Arial, Helvetica, sans-serif'; g.fillText('7.5  ORAL  ID 7.5 mm', 0, 0); g.restore();
  g.lineWidth = 2; g.beginPath(); g.ellipse(W - 1.6 * PX, 88, 0.32 * PX, 12, 0, 0, TAU); g.stroke();   // Murphy eye outline
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; t.wrapT = THREE.RepeatWrapping; t.offset.y = 0.25;
  return t;
}

function makeBackdrop() {
  const c = document.createElement('canvas'); c.width = 8; c.height = 256;
  const g = c.getContext('2d'), grd = g.createLinearGradient(0, 0, 0, 256);
  grd.addColorStop(0, '#46514f'); grd.addColorStop(0.55, '#262e2f'); grd.addColorStop(1, '#141819');
  g.fillStyle = grd; g.fillRect(0, 0, 8, 256);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}

function makeGripBump() {
  const c = document.createElement('canvas'); c.width = 64; c.height = 256; const g = c.getContext('2d');
  g.fillStyle = '#808080'; g.fillRect(0, 0, 64, 256);
  for (let y = 0; y < 256; y += 8) { g.fillStyle = '#b0b0b0'; g.fillRect(0, y, 64, 3); }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; return t;
}

// ---------------------------------------------------------------- geometry: loft along a spine
// fn(d, out) gives the spine point at arc distance d. The cross-section can vary per angle, so one
// function builds tubes, tissue walls, cords and blades.
const _P = new V3(), _T = new V3(), _N = new V3(), _B = new V3(), _a = new V3(), _b = new V3();
function frameAt(fn, d, ref) {
  fn(d - 0.01, _a); fn(d + 0.01, _b); _T.subVectors(_b, _a).normalize(); fn(d, _P);
  _N.copy(ref).addScaledVector(_T, -_T.dot(ref)).normalize(); _B.crossVectors(_T, _N);
}
const ellipseR = (a, rx, ry) => 1 / Math.sqrt((Math.cos(a) / rx) ** 2 + (Math.sin(a) / ry) ** 2);

function loft({ fn, d0, d1, rings, radial, ref = new V3(0, 1, 0), radius, roll = 0, power = 1, bevel, axial, uv, disp, color }) {
  const n = (rings + 1) * (radial + 1);
  const pos = new Float32Array(n * 3), uvs = new Float32Array(n * 2), col = color ? new Float32Array(n * 3) : null;
  let k = 0;
  for (let i = 0; i <= rings; i++) {
    const f = i / rings, d = d0 + (d1 - d0) * Math.pow(f, power);
    for (let j = 0; j <= radial; j++) {
      const a = (j / radial) * TAU;
      let dd = bevel ? bevel(d, a) : d;
      if (axial) dd += axial(f, a);
      frameAt(fn, dd, ref);
      const r = radius(f, a, dd) + (disp ? disp(i, j, f, a) : 0);
      const ang = a + roll, c = Math.cos(ang) * r, s = Math.sin(ang) * r;
      pos[k * 3] = _P.x + _N.x * c + _B.x * s; pos[k * 3 + 1] = _P.y + _N.y * c + _B.y * s; pos[k * 3 + 2] = _P.z + _N.z * c + _B.z * s;
      const u = uv ? uv(f, a, dd) : f;
      uvs[k * 2] = u; uvs[k * 2 + 1] = j / radial;
      if (col) { const cc = color(f, a, dd); col[k * 3] = cc[0]; col[k * 3 + 1] = cc[1]; col[k * 3 + 2] = cc[2]; }
      k++;
    }
  }
  const idx = [];
  for (let i = 0; i < rings; i++) for (let j = 0; j < radial; j++) {
    const a = i * (radial + 1) + j, b = a + radial + 1;
    idx.push(a, b, a + 1, b, b + 1, a + 1);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
  if (col) g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  g.setIndex(idx); g.computeVertexNormals();
  const nr = g.attributes.normal.array;                  // weld the seam normals
  for (let i = 0; i <= rings; i++) {
    const p = i * (radial + 1) * 3, q = (i * (radial + 1) + radial) * 3;
    for (let c = 0; c < 3; c++) { const m = (nr[p + c] + nr[q + c]) / 2; nr[p + c] = nr[q + c] = m; }
  }
  return g;
}

// Spine from a dense polyline, parameterised by arc length (extends straight past both ends).
function polylineFn(pts) {
  const acc = [0]; for (let i = 1; i < pts.length; i++) acc.push(acc[i - 1] + pts[i].distanceTo(pts[i - 1]));
  const L = acc[acc.length - 1];
  const fn = (d, out) => {
    if (d <= 0) return out.copy(pts[0]).addScaledVector(_dir(pts[1], pts[0]), d);
    if (d >= L) return out.copy(pts[pts.length - 1]).addScaledVector(_dir(pts[pts.length - 1], pts[pts.length - 2]), d - L);
    let lo = 0, hi = acc.length - 1;
    while (hi - lo > 1) { const m = (lo + hi) >> 1; if (acc[m] <= d) lo = m; else hi = m; }
    return out.lerpVectors(pts[lo], pts[hi], (d - acc[lo]) / (acc[hi] - acc[lo]));
  };
  fn.len = L; return fn;
}
const _dtmp = new V3();
function _dir(a, b) { return _dtmp.subVectors(a, b).normalize(); }

// ---------------------------------------------------------------- materials

// ================================================================= renderer and the shared world
// Coordinates, in cm: x = patient's right (the operator's right), y = anterior (toward the ceiling),
// z = cranial (toward the operator standing at the head). The upper incisors sit near the origin.
const canvas = $('stage');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.toneMapping = THREE.AgXToneMapping;
renderer.toneMappingExposure = 1.05;

const LAYER_SAG = 1, LAYER_VL = 2;       // layer 0 = instruments, seen by both cameras
const world = new THREE.Scene();
const onLayer = (obj, layer) => { obj.traverse((o) => o.layers.set(layer)); return obj; };
const envTex = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
const sagBackdrop = makeBackdrop();
const vlFog = new THREE.FogExp2(0x000000, 0.05);
