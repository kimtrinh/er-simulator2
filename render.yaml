# One-click deploy config for Render (https://render.com).
#
# The site is bring-your-own-key: every visitor pastes their own Gemini (free)
# or Claude key into the site's "API Key" settings, and it's used only for their
# own requests. Nobody can spend the site owner's keys.
#
# Optional — to play on your own site without pasting a key, set in Render's dashboard:
#   OWNER_ACCESS_CODE — a long private passphrase only you know
#   GEMINI_API_KEY    — your key (free, https://aistudio.google.com/apikey), and/or
#   ANTHROPIC_API_KEY — your key (paid)
# then enter the access code in the site's API Key settings on your own devices.
# Without OWNER_ACCESS_CODE the server's keys are never used at all.
services:
  - type: web
    name: medisim-er
    runtime: node
    plan: free
    # --include=dev forces build tools (vite, esbuild, typescript) to install
    # even though NODE_ENV=production is set for the running server.
    buildCommand: npm install --include=dev && npm run build
    startCommand: node dist/server.cjs
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: OWNER_ACCESS_CODE
        sync: false # optional; never committed
      - key: GEMINI_API_KEY
        sync: false # optional, owner-only (needs OWNER_ACCESS_CODE)
      - key: ANTHROPIC_API_KEY
        sync: false # optional, owner-only (needs OWNER_ACCESS_CODE)
      - key: AI_PROVIDER
        sync: false # optional: "gemini" or "claude" for the owner key
